[build]
builder = "nixpacks"
buildCommand = "pip install -r backend/requirements.txt && python -m prisma py fetch && cd backend && python -m prisma generate --schema prisma/schema.prisma && python -m prisma db push --schema prisma/schema.prisma --skip-generate"

[deploy]
startCommand = "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
