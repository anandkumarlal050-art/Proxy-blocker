# nixpacks.toml — Python via Nix + virtualenv (proper Nix pattern)

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv",
  "/opt/venv/bin/pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "/opt/venv/bin/python -m prisma py fetch",
  "cd backend && /opt/venv/bin/python -m prisma generate --schema prisma/schema.prisma",
  "cd backend && /opt/venv/bin/python -m prisma db push --schema prisma/schema.prisma --skip-generate"
]

[start]
cmd = "cd backend && /opt/venv/bin/python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
